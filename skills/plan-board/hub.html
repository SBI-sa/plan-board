/* Layout: one sticky bar (back link, title, progress, save state, who you are, look picker) with a tab strip under it on a decision page.
   Dashboard: stat tiles, decision cards with progress, activity feed. Decision page: one panel per archetype, Board last.
   Every decidable item shares one anatomy: rail, id chip, plain title, stamp, body, Claude's suggestion, who voted, Claude's follow-up, verdict pills, note.
   Four colours with fixed meanings: green yes, red no, amber later/change/flag, blue Claude's suggestion. Claude's follow-up states use shape only (filled, outlined, dashed). */

/* ---------- default skin: glass ---------- */
:root, .skin{
  --l-bg:#e8ecf8; --l-surface:rgba(255,255,255,.58); --l-well:rgba(255,255,255,.55); --l-fg:#161a22; --l-muted:#5a6475;
  --l-line:rgba(22,26,34,.10); --l-line2:rgba(22,26,34,.24);
  --l-sug:#2f52d6; --l-sug-bg:rgba(47,82,214,.12); --l-yes:#157a47; --l-yes-bg:rgba(21,122,71,.12);
  --l-no:#b5261e; --l-no-bg:rgba(181,38,30,.12); --l-wait:#9a6400; --l-wait-bg:rgba(154,100,0,.14); --l-on:#ffffff;
  --l-backdrop:radial-gradient(42% 48% at 6% 8%,#8fb0ff 0%,transparent 70%),radial-gradient(38% 44% at 96% 10%,#ffa8cf 0%,transparent 70%),radial-gradient(40% 46% at 78% 92%,#a9c4ff 0%,transparent 70%),radial-gradient(34% 40% at 10% 90%,#c9c2ff 0%,transparent 70%),radial-gradient(30% 34% at 50% 45%,#c9b8ff 0%,transparent 70%),linear-gradient(160deg,rgba(234,240,255,.75) 0%,rgba(244,238,252,.75) 100%),var(--planet) 70% center/cover no-repeat;
  --l-bar-bg:rgba(255,255,255,.5); --l-shell:transparent; --l-txt-sh:0 1px 1px rgba(0,0,0,.18); --l-hi:rgba(255,255,255,.55);
  --d-bg:#0a0d18; --d-surface:rgba(22,26,40,.55); --d-well:rgba(255,255,255,.07); --d-fg:#e8eaf0; --d-muted:#98a1b3;
  --d-line:rgba(255,255,255,.10); --d-line2:rgba(255,255,255,.22);
  --d-sug:#9eb0ff; --d-sug-bg:rgba(158,176,255,.14); --d-yes:#63d391; --d-yes-bg:rgba(99,211,145,.14);
  --d-no:#ff8a7a; --d-no-bg:rgba(255,138,122,.14); --d-wait:#f0c25a; --d-wait-bg:rgba(240,194,90,.14); --d-on:#0d1017;
  --d-backdrop:radial-gradient(42% 48% at 6% 8%,#2a3f9e 0%,transparent 70%),radial-gradient(38% 44% at 96% 10%,#7a2a62 0%,transparent 70%),radial-gradient(40% 46% at 78% 92%,#1d2f5e 0%,transparent 70%),radial-gradient(34% 40% at 10% 90%,#3a2a5e 0%,transparent 70%),radial-gradient(30% 34% at 50% 45%,#3d2a7a 0%,transparent 70%),linear-gradient(160deg,rgba(11,16,32,.5) 0%,rgba(18,12,31,.5) 100%),var(--planet) 70% center/cover no-repeat;
  --d-bar-bg:rgba(18,22,36,.48); --d-shell:transparent; --d-txt-sh:none; --d-hi:rgba(255,255,255,.28);

  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --sect:20px; --pad:14px 16px;

body{background:var(--bg);color:var(--fg);font:15px/var(--body-lh) var(--sans)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--backdrop)}
button{font:inherit}
a{color:inherit}
code{font-family:var(--mono);font-size:.88em;background:var(--well);padding:1px 5px;border-radius:4px}
h1,h2,h3{font-family:var(--head);font-weight:var(--head-w);text-transform:var(--head-tt);letter-spacing:var(--head-ls);text-wrap:balance}
p,li{text-wrap:pretty}
.t{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sug);outline-offset:2px}
.v,.btn,.jump,.lc,.card,.sc,.sf,.tab,.cta{transition:transform .2s cubic-bezier(.32,.72,0,1),background-color .15s,border-color .15s,color .15s}
.v:active,.btn:active,.lc:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Sticky bar + tabs */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-top));z-index:5;margin:var(--bar-m);background:var(--bar-bg);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);border:var(--bw) solid var(--line);border-top:0;border-radius:var(--bar-radius);box-shadow:var(--bar-shadow)}

.bar-in{max-width:1100px;margin:0 auto;padding:12px 16px 8px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:2px;align-items:center;min-width:0}
.tl > :not(.brand){grid-column:2}
/* App-header logo: top-left, links home. The SVG carries its own clear space, so the box is 46px for a ~32px visible mark */
.brand{grid-row:1 / span 3;display:block;line-height:0}
.brand .logo{--lh:46px;margin:0}
.back{font-size:var(--fs-sm);font-weight:700;color:var(--muted);text-decoration:none;justify-self:start}
.back:hover{color:var(--fg)}
h1{font-size:1.25rem;margin:0}
.sub{margin:0;color:var(--muted);font-size:var(--fs-sm)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:var(--fs-sm);min-height:44px}
.progress{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress:empty{display:none}
.save{color:var(--muted);white-space:nowrap}
/* Look picker: always the last item in the bar, level with the status row */
.bar-in > .skinpick{align-self:flex-end;flex:0 0 auto;white-space:nowrap}
.who{display:inline-flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
.who .av{width:20px;height:20px}
.skinpick select option{background:var(--bg);color:var(--fg)}
.skinpick select{font:inherit;font-size:var(--fs-sm);min-height:44px;padding:0 8px;border:var(--bw-ctrl) solid var(--line-2);border-radius:var(--rb);background:var(--well);color:var(--fg)}
.tabs{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:10px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:700;text-transform:var(--tab-tt);letter-spacing:var(--tab-ls);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .n{font:600 var(--fs-xs)/1 var(--mono);padding:3px 6px;border-radius:999px;background:var(--well);color:var(--muted);font-variant-numeric:tabular-nums}
.tab .n.done{background:var(--yes-bg);color:var(--yes)}

/* Panels */
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.panel[hidden]{display:none}
.ph{display:grid;gap:4px;margin-bottom:var(--sect)}
.arche{font-family:var(--sans);font-size:var(--fs-xs);font-weight:600;line-height:1;letter-spacing:0;text-transform:none;color:var(--muted)}
.arche::before{content:var(--arche-pre)}
.ph h2{margin:0;font-size:1.6rem;text-wrap:balance}
.ph p{margin:0;color:var(--muted);max-width:70ch}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 var(--sect)}
.bulkx{display:contents}
.bulkx[hidden]{display:none}
.bulk:not(:has(>:not([hidden]))){display:none}
.bulk .q,.q{color:var(--muted);font-size:var(--fs-sm)}
.btn{min-height:44px;padding:0 14px;border-radius:var(--rb);border:var(--bw-ctrl) solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer;white-space:nowrap}
.empty,.notice{color:var(--muted);margin:0}
.notice{padding:10px 12px;border:var(--bw) solid var(--line-2);border-radius:var(--r);margin-bottom:var(--sect)}

/* Item anatomy */
.list,.steps{display:grid;gap:14px}
.item{background:var(--surface);border:var(--bw) solid var(--line);border-left:var(--rail) dashed var(--line-2);border-radius:var(--r);padding:var(--pad);display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.item[data-state="yes"]{border-left:var(--rail) solid var(--yes)}
.item[data-state="no"]{border-left:var(--rail) solid var(--no)}
.item[data-state="wait"]{border-left:var(--rail) solid var(--wait)}
.item.norail,.item.norail[data-state]{border-left:var(--bw) solid var(--line)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.head h3{margin:0;font-size:var(--h3);flex:1 1 auto;min-width:0}
.chip{font:600 var(--fs-xs)/1 var(--mono);padding:4.5px 6px;border:1.5px solid transparent;border-radius:4px;background:var(--well);color:var(--muted);white-space:nowrap;text-transform:var(--chip-tt)}
.chip.hot{background:var(--fg);color:var(--bg)}
.stamp{font:700 var(--fs-xs)/1 var(--mono);letter-spacing:var(--badge-ls);text-transform:var(--badge-tt);padding:4.5px 8px;border-radius:4px;border:1.5px solid transparent;color:var(--muted)}
.stamp::before{content:var(--stamp-pre)} .stamp::after{content:var(--stamp-post)}
.stamp[data-tone="yes"]{color:var(--yes);border-color:var(--yes);background:var(--yes-bg)}
.stamp[data-tone="no"]{color:var(--no);border-color:var(--no);background:var(--no-bg)}
.stamp[data-tone="wait"]{color:var(--wait);border-color:var(--wait);background:var(--wait-bg)}
.stamp.split{color:var(--fg);border-color:var(--fg);border-style:dashed}
.body{display:grid;gap:6px;max-width:72ch}
.body p,.body ul{margin:0}
.body ul{padding-left:1.2em}
.why{color:var(--muted);font-size:var(--fs-sm);margin:0}
.suggest{margin:0;font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
.suggest b{color:var(--sug)}
.suggest .rs{color:var(--muted)}
.sl{font:600 var(--fs-xs)/1 var(--mono);letter-spacing:var(--badge-ls);text-transform:var(--badge-tt);padding:4px 6px;border-radius:4px;background:var(--sug-bg);color:var(--sug)}
.decide{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.verdicts{display:flex;flex-wrap:wrap;gap:8px}
.v{min-height:44px;padding:0 16px;border-radius:var(--rp);border:var(--bw-ctrl) solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer}
.v[data-tone="yes"]{--tint:var(--yes)} .v[data-tone="no"]{--tint:var(--no)} .v[data-tone="wait"]{--tint:var(--wait)}
.v:hover{border-color:var(--tint);color:var(--tint)}
.v[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.cm{flex:1 1 100%;display:grid;gap:4px;min-width:0}
.cm[hidden]{display:none}
.addc{flex:0 0 auto}
.due{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.duein{font:inherit;font-size:var(--fs-sm);min-height:44px;padding:0 8px;border:var(--bw-ctrl) solid var(--line-2);border-radius:var(--rb);background:var(--well);color:var(--fg)}
.item.overdue .duein,.chip.late{border-color:var(--no);color:var(--no)}
.cm span{font-family:var(--sans);font-size:var(--fs-xs);font-weight:600;line-height:1;letter-spacing:0;text-transform:none;color:var(--muted)}
.note{box-sizing:border-box;width:100%;min-width:0;min-height:64px;padding:10px 12px;border:var(--bw-ctrl) solid var(--line-2);border-radius:calc(var(--r) * .6);background:var(--well);color:var(--fg);font:inherit;font-size:var(--fs-sm);line-height:1.45;resize:vertical}
.note::placeholder{color:var(--muted)}
.cms{justify-self:end;min-height:1em;font-style:normal;font-size:var(--fs-xs);color:var(--muted)}
.cms.ok{color:var(--yes)}
/* Autosave cue: the box glows green once, the label under it says Saved */
.note.saved{animation:savedglow 1.6s ease-out}
@keyframes savedglow{0%,30%{border-color:var(--yes);box-shadow:0 0 0 4px var(--yes-bg)}}

/* Who voted + Claude's follow-up + earlier rounds */
.av{width:22px;height:22px;border-radius:50%;background:var(--well);object-fit:cover;flex:0 0 auto;border:2px solid var(--surface);box-sizing:border-box}
.people{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:var(--fs-sm);color:var(--muted)}
.people:empty{display:none}
.vt{display:inline-flex;align-items:center;gap:6px}
.vt .av{border:2px solid var(--line-2)}
.vt[data-tone="yes"] .av{border-color:var(--yes)} .vt[data-tone="no"] .av{border-color:var(--no)} .vt[data-tone="wait"] .av{border-color:var(--wait)}
.vt b{color:var(--fg)}
.onote{margin:0;color:var(--muted);font-size:var(--fs-sm)}
.onote b{color:var(--fg)}
.cs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:var(--fs-sm);color:var(--muted)}
.cs:empty{display:none}
.cst{font:700 var(--fs-xs)/1 var(--mono);letter-spacing:var(--badge-ls);text-transform:var(--badge-tt);padding:4.5px 8px;border-radius:4px;border:1.5px solid var(--fg);color:var(--fg);white-space:nowrap}
.cst[data-state="applied"]{background:var(--fg);color:var(--bg)}
.cst[data-state="needs"]{box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3.5px var(--fg)}
.cst[data-state="skipped"]{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.cst.stale{opacity:.6;text-decoration:line-through}
/* Follow-up thread: Claude's question, your reply, a box to answer it */
.fup{display:grid;gap:8px;padding:10px 12px;border-left:3px solid var(--wait);background:var(--wait-bg);border-radius:4px}
.fup[hidden]{display:none}
.fup .msg{margin:0;font-size:var(--fs-sm)}
.fup .msg b{display:block;font-size:var(--fs-xs);color:var(--muted)}
.fup .msg.me{justify-self:end;max-width:85%;padding:8px 10px;border-radius:10px;background:var(--surface);border:var(--bw) solid var(--line-2)}
.fup .row{display:flex;gap:8px;align-items:flex-end}
.fupin{flex:1 1 auto;min-width:0;min-height:44px;padding:10px 12px;border:var(--bw-ctrl) solid var(--line-2);border-radius:calc(var(--r) * .6);background:var(--well);color:var(--fg);font:inherit;font-size:var(--fs-sm);resize:vertical}
.pdone{justify-self:start;margin-top:6px;min-height:44px}
.cs .t,.feed .t,.foot .t{color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.hist{margin:0;color:var(--muted);font-size:var(--fs-sm);display:grid;gap:2px}
.hist:empty{display:none}
.say{font-family:var(--mono);font-weight:600;background:var(--well);padding:2px 6px;border-radius:4px;color:var(--fg)}

/* Highlighted controls: tinted Liquid Glass, solid fallbacks */
.btn.sug{--tint:var(--sug)}
.v[aria-pressed="true"],.btn.sug{
  position:relative;isolation:isolate;color:var(--on);
  border-color:color-mix(in srgb,var(--tint) 62%,#fff);
  background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.06) 48%,rgba(255,255,255,0) 56%,rgba(255,255,255,.10) 100%),color-mix(in srgb,var(--tint) 90%,transparent);
  -webkit-backdrop-filter:var(--ctrl-blur);backdrop-filter:var(--ctrl-blur);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(0,0,0,.14),0 8px 24px -8px color-mix(in srgb,var(--tint) 55%,transparent);
  text-shadow:var(--txt-sh);
}
.v[aria-pressed="true"]::before,.btn.sug::before{
  content:"";position:absolute;inset:0;padding:1px;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.08) 40% 60%,rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
}
.v[aria-pressed="true"]:hover,.btn.sug:hover{color:var(--on);border-color:color-mix(in srgb,var(--tint) 50%,#fff)}
.btn.sug.go{background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.06) 48%,rgba(255,255,255,0) 56%,rgba(255,255,255,.10) 100%),var(--tint)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .v[aria-pressed="true"],.btn.sug,.btn.sug.go{background:var(--tint)}
}
@media (prefers-reduced-transparency: reduce),(prefers-contrast: more){
  .v[aria-pressed="true"],.btn.sug,.btn.sug.go{background:var(--tint);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 2px var(--on);text-shadow:none;border-color:var(--tint)}
  .v[aria-pressed="true"]::before,.btn.sug::before{display:none}
  .bar{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
}
@media (prefers-reduced-motion:reduce){.v:active,.btn:active,.lc:active{transform:none}}
/* The glass shine belongs to Glass and Soft; flat looks get a solid fill */
:root:is([data-skin="brutal"],[data-skin="editorial"],[data-skin="sketch"]) :is(.v[aria-pressed="true"],.btn.sug,.btn.sug.go),
:is(.skin-brutal,.skin-editorial,.skin-sketch) .v[aria-pressed="true"]{
  background:var(--tint);border-color:var(--tint);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;text-shadow:none}
:root:is([data-skin="brutal"],[data-skin="editorial"],[data-skin="sketch"]) :is(.v[aria-pressed="true"],.btn.sug)::before,
:is(.skin-brutal,.skin-editorial,.skin-sketch) .v[aria-pressed="true"]::before{display:none}
:root[data-skin="sketch"] :is(.v[aria-pressed="true"],.btn.sug,.btn.sug.go){box-shadow:2px 3px 0 var(--line)}
@media (prefers-reduced-transparency: reduce),(prefers-contrast: more){
  :root:root:root :is(.v[aria-pressed="true"],.btn.sug,.btn.sug.go){box-shadow:inset 0 0 0 2px var(--on)}
}

/* One hover per control, every look inherits it; touch screens skip it */
@media (hover:hover){
  .btn:not(.sug):not(.todo):hover,.sf:not([aria-pressed="true"]):hover,.skinpick select:hover{border-color:var(--fg);background:color-mix(in srgb,var(--surface) 90%,var(--fg))}
  .sf:not([aria-pressed="true"]):hover,.tab:hover{color:var(--fg)}
  .tab[aria-selected="false"]:hover{border-bottom-color:var(--line-2)}
  .lc:hover,.sc:hover,.card:hover{border-color:var(--fg);transform:translateY(-1px)}
  .btn.todo:hover,.cta:hover{background:color-mix(in srgb,var(--fg) 82%,var(--bg))}
  .btn.sug:hover{filter:brightness(1.08)}
}
@media (hover:hover){.lc:hover:active,.sc:hover:active,.card:hover:active{transform:scale(.97)}}
@media (hover:hover) and (prefers-reduced-motion:reduce){.lc:hover,.sc:hover,.card:hover,.lc:hover:active,.sc:hover:active,.card:hover:active{transform:none}}

/* Save failed: red in the bar and on the item, until a later save goes through */
.save.err{color:var(--no);font-weight:700}
.vfail{flex:1 1 100%;margin:0;color:var(--no);font-size:var(--fs-sm);font-weight:700}
.vfail[hidden],.due[hidden],.adddue[hidden]{display:none}

/* Landing after a jump: a ring fades out (opacity only) */
.item.landed{outline:3px solid var(--fg);outline-offset:3px;animation:landed 1.6s ease-out forwards}
@keyframes landed{0%,35%{outline-color:var(--fg)}100%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.item.landed{animation-duration:2.4s}}

/* Short hints under tiles and lanes; role chip and look label */
.hint{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:400;line-height:1.3}
.lk{font-size:var(--fs-xs);font-weight:600;color:var(--muted);margin-right:6px}
.role{cursor:help}

/* All applied: ask to close; plan undo toast (z-index scale: backdrop -1, bar 5, toast 10) */
.nudge{margin:0;font-size:var(--fs-sm);font-weight:700}
.nudgebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;margin-bottom:var(--sect);border:2px solid var(--yes);border-radius:var(--r);background:var(--yes-bg)}
.nudgebar[hidden]{display:none}
.nudgebar p{margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 16px;max-width:calc(100vw - 32px);background:var(--fg);color:var(--bg);border-radius:var(--rb);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.toast .btn,#toast .btn:hover{min-height:40px;background:transparent;color:var(--bg);border-color:var(--bg)}

/* Copyable prompts (first run, tips) */
.prompt{display:grid;gap:8px}
.prompt pre{margin:0;white-space:pre-wrap;font:var(--fs-sm)/1.5 var(--mono);background:var(--well);border:var(--bw) solid var(--line);border-radius:calc(var(--r) * .6);padding:10px 12px;max-width:72ch}
.prompt .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copied{color:var(--yes);font-size:var(--fs-sm);font-weight:700}
.tips,.invite{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);display:grid;gap:10px;box-shadow:var(--shadow)}
.tips summary{cursor:pointer;font-weight:700;list-style-position:inside;padding-block:10px;min-height:44px;box-sizing:border-box}
.tips h3,.invite h3{margin:0;font-size:1.05rem}
.tips p,.invite p{margin:0;max-width:80ch}
.tip{margin-top:6px;border-left:2px solid var(--sug);padding:6px 0 6px 12px}
.tip summary{cursor:pointer;font-size:var(--fs-sm);font-weight:700;color:var(--sug);padding-block:10px;min-height:44px;box-sizing:border-box}
.panel > .tip{margin:0 0 var(--sect);max-width:80ch}
.dhint{margin:0 0 var(--sect);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:var(--fs-sm);color:var(--muted)}
.sk + .btn.inst{min-height:32px;padding:0 10px;font-size:var(--fs-xs)}

/* Glass only: cards are Apple-style glass panes over the fixed backdrop.
   Recipe from react-bits GlassSurface (its non-refraction path): blur + saturate + slight brighten, a diagonal sheen,
   a bright top rim and faint bottom rim, an inner edge glow, and three stacked soft shadows. */
:root[data-skin="glass"]{--sheen-a:hsl(0 0% 100% / .26);--sheen-b:hsl(0 0% 100% / .12);--rim-t:hsl(0 0% 100% / .85);--rim-b:hsl(0 0% 100% / .35);--edge:hsl(0 0% 100% / .28)}
@media (prefers-color-scheme: dark){:root[data-skin="glass"]:not([data-theme="light"]){--sheen-a:hsl(0 0% 100% / .14);--sheen-b:hsl(0 0% 100% / .05);--rim-t:hsl(0 0% 100% / .30);--rim-b:hsl(0 0% 100% / .08);--edge:hsl(0 0% 100% / .10)}}
:root[data-skin="glass"][data-theme="dark"]{--sheen-a:hsl(0 0% 100% / .14);--sheen-b:hsl(0 0% 100% / .05);--rim-t:hsl(0 0% 100% / .30);--rim-b:hsl(0 0% 100% / .08);--edge:hsl(0 0% 100% / .10)}
:root[data-skin="glass"] .item,:root[data-skin="glass"] .final,:root[data-skin="glass"] .opt,:root[data-skin="glass"] .tblwrap,:root[data-skin="glass"] .tile,:root[data-skin="glass"] .card,:root[data-skin="glass"] .lane,:root[data-skin="glass"] .guide li,.skin-glass .pvs-item{
  -webkit-backdrop-filter:blur(16px) saturate(160%) brightness(1.04);backdrop-filter:blur(16px) saturate(160%) brightness(1.04);
  background-image:linear-gradient(135deg,var(--sheen-a) 0%,transparent 42% 64%,var(--sheen-b) 100%);
  box-shadow:inset 0 1px 0 0 var(--rim-t),inset 0 -1px 0 0 var(--rim-b),inset 0 0 12px 3px var(--edge),
    0 4px 16px rgba(17,17,26,.06),0 8px 24px rgba(17,17,26,.06),0 16px 56px rgba(17,17,26,.06);
}
:root[data-skin="glass"] tbody th{background:transparent}
:root[data-skin="glass"] .lane{background:color-mix(in srgb,var(--bg) 72%,transparent)}
@media (prefers-reduced-transparency: reduce),(prefers-contrast: more){
  :root[data-skin="glass"]{--surface:var(--bg);--well:var(--bg)}
  :root[data-skin="glass"] .item,:root[data-skin="glass"] .final,:root[data-skin="glass"] .opt,:root[data-skin="glass"] .tblwrap,:root[data-skin="glass"] .tile,:root[data-skin="glass"] .card,:root[data-skin="glass"] .lane{-webkit-backdrop-filter:none;backdrop-filter:none;background-image:none}
}

/* Pick: option cards with previews */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
@media (min-width:641px){.opts:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,1fr)}}
.opt{border:var(--bw) solid var(--line);border-left:var(--rail) dashed var(--line-2);border-radius:calc(var(--r) * .6);padding:var(--pad);display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.opt > .v{margin-top:auto}
.opt > a.demo{align-self:flex-start}
.opt[data-state="yes"]{border-left:var(--rail) solid var(--yes);box-shadow:inset 0 0 0 1px var(--yes)}
.opt .name{display:flex;gap:8px;align-items:center}
.opt .desc{margin:0;color:var(--muted);font-size:var(--fs-sm)}
.opt.ref{margin:0;border-left:var(--bw) solid var(--line);background:var(--well)}
.opt.ref figcaption{font-size:var(--fs-sm);color:var(--muted)}
.opt.ref figcaption b{color:var(--fg)}
.pvbox{background:var(--well);border-radius:6px;padding:14px;min-height:100px;display:grid;place-items:center;pointer-events:none}
.pvbox:empty{display:none}
.pv{width:100%;max-width:300px;font-size:12px;line-height:1.4}
.pv-item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:6px;padding:10px;display:grid;gap:8px}
.pv-t{font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
.pv-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pv-dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);display:inline-block}
.pv-dot.yes{background:var(--yes)} .pv-dot.no{background:var(--no)} .pv-dot.wait{background:var(--wait)}
.pv-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden} .pv-bar i{display:block;height:100%;width:60%;background:var(--fg)}
.pvbox.wide{padding:0;background:transparent;min-height:0}
.pvs{width:100%;background:var(--bg);background-image:var(--backdrop);border-radius:6px;padding:12px;display:grid;gap:10px;font-family:var(--sans);color:var(--fg);font-size:13px;line-height:1.4;border:1px solid var(--line)}
.pvs-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bar-bg);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);border:var(--bw) solid var(--line);border-radius:var(--bar-radius);padding:7px 10px;box-shadow:var(--bar-shadow)}
.pvs-bar b{font-family:var(--head);font-weight:var(--head-w);text-transform:var(--head-tt);letter-spacing:var(--head-ls)}
.pvs-bar span{font:700 11px/1 var(--mono);font-variant-numeric:tabular-nums}
.pvs-item{background:var(--surface);border:var(--bw) solid var(--line);border-left:var(--rail) solid var(--yes);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;box-shadow:var(--shadow);margin:6px 2px 2px}
.pvs-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pvs-title{flex:1 1 auto;min-width:0;font-family:var(--head);font-weight:var(--head-w);text-transform:var(--head-tt);letter-spacing:var(--head-ls)}
.pvs .suggest{font-size:12px}
.pvs .v{min-height:36px;padding:0 12px;font-size:12px}

/* Compare: criteria table, first column sticky, picked column tinted */
.tblwrap{overflow-x:auto;border:var(--bw) solid var(--line);border-radius:calc(var(--r) * .5);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-weight:400}
thead th{font-weight:700}
thead th .chip{margin-right:4px}
tbody th{position:sticky;left:0;background:var(--surface);color:var(--muted);font-size:var(--fs-sm);width:150px;font-weight:700}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
td.picked,thead th.picked{background:var(--yes-bg)}
tbody th.picked{background:var(--surface)}

/* Process: numbered stepper (order is real here) */
.steps .item{position:relative;margin-left:36px}
.steps .item::before{content:attr(data-n);position:absolute;left:-36px;top:14px;width:26px;height:26px;border-radius:var(--rp);background:var(--fg);color:var(--bg);font:700 var(--fs-xs)/26px var(--mono);text-align:center}
.steps .item::after{content:"";position:absolute;left:-24px;top:44px;bottom:-18px;width:2px;background:var(--line-2)}
.steps .item:last-child::after{display:none}
.steps .item[data-state="yes"]::before{background:var(--yes);color:var(--on)}
.steps .item[data-state="wait"]::before{background:var(--wait);color:var(--on)}

/* Board: lanes of small cards, then the wrap-up box and this decision's activity */
.boardwrap{display:grid;gap:var(--sect)}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.lane{background:var(--well);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.lane h3{margin:0;font-size:var(--fs-xs);display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:600}
.lane h3 .n{font-variant-numeric:tabular-nums;color:var(--fg)}
.lane .none{color:var(--muted);font-size:var(--fs-sm);margin:0}
.lc{width:100%;background:var(--surface);border:var(--bw) solid var(--line);border-left:var(--rail) dashed var(--line-2);border-radius:calc(var(--r) * .6);padding:8px 10px;display:grid;gap:4px;cursor:pointer;text-align:left;color:inherit;min-width:0}
.lc[data-state="yes"]{border-left:var(--rail) solid var(--yes)} .lc[data-state="no"]{border-left:var(--rail) solid var(--no)} .lc[data-state="wait"]{border-left:var(--rail) solid var(--wait)}
.lc .lt{font-weight:700;font-size:var(--fs-sm)}
.lc .lr{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.lc .avs .av{width:18px;height:18px}
.avs{display:inline-flex}
.avs .av{margin-left:-6px}
.avs .av:first-child{margin-left:0}
.final{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);display:grid;gap:10px;justify-items:start;box-shadow:var(--shadow)}
.final p{margin:0}
.final .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.final textarea{width:100%;min-height:160px;font:var(--fs-sm)/1.4 var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--well);color:var(--fg);padding:8px}

/* Dashboard */
.dash{display:grid;gap:var(--sect)}
/* Headings sit 8px from what they label */
.dash > .rowh{margin-bottom:calc(8px - var(--sect))}
.guide{display:grid;gap:8px}
/* SBI logo per brand board: one colour only (Main Green on light, Ivory reversed on dark), never stretched, clear space = 25% of its height, min height 32px */
:root{--brand:#397D5C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#F5F5F0}}
:root[data-theme="dark"]{--brand:#F5F5F0}
.hero{display:grid;gap:12px;padding:20px 0 4px}
.logo{--lh:clamp(44px,9vw,68px);display:block;justify-self:start;height:var(--lh);aspect-ratio:479.94/284.62;margin-bottom:calc(var(--lh) * .25);background:var(--brand);-webkit-mask:var(--logo-svg) center/contain no-repeat;mask:var(--logo-svg) center/contain no-repeat}
.hello{margin:0;font-size:var(--fs-md);font-weight:600;color:var(--muted)}
.big{margin:0;font:var(--head-w) clamp(2.4rem,8vw,4.4rem)/.98 var(--head);letter-spacing:-.035em;text-transform:var(--head-tt);text-wrap:balance}
.lead{margin:0;max-width:52ch;font-size:1.06rem;color:var(--muted)}
.cta{justify-self:start;display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border:var(--bw-ctrl) solid var(--fg);border-radius:var(--rp);background:var(--fg);color:var(--bg);font-weight:700;text-decoration:none}
/* How it works = the loop: three steps joined by arrows, and a dashed return from step 3 back to step 2 for "Needs you" */
.guide ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.guide li{position:relative;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.guide li + li::before{content:"";position:absolute;z-index:1;left:-10px;top:50%;width:7px;height:7px;border:solid var(--fg);border-width:2px 2px 0 0;transform:translateY(-50%) rotate(45deg)}
.loopback{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:-8px 0 0}
.loopback p{position:relative;grid-column:2 / 4;margin:0 calc((100% - 12px) / 4);padding:12px 8px 6px;border:2px dashed var(--line-2);border-top:0;border-radius:0 0 14px 14px;text-align:center;font-size:var(--fs-sm);color:var(--muted)}

/* ---------- board ---------- */
function renderBoard() {
  const box = $("#board"), pid = view.id, pg = S.pages[pid]; if (!box || !pg) return;
  const items = pg.items || [];
  const lanes = LANES.map(([k, label, hint]) => {
    const its = items.filter(i => laneOf(pid, i) === k);
    return `<div class="lane"><h3><span>${label}<span class="hint">${hint}</span></span><span class="n">${its.length}</span></h3>${its.length ? its.map(i => laneCard(pg, pid, i)).join("") : `<p class="none">None</p>`}</div>`;
  }).join("");
  const left = items.filter(i => !isDecided(pid, i)).length;
  const done = (pg.state || "open") === "done";
  box.innerHTML = `<div class="lanes">${lanes}</div>
    <div class="final">
      ${left ? `<p><b>${left} still to decide.</b> Tap a card above, or take Claude's suggestions on each tab.</p>` : `<p><b>All ${items.length} decided.</b></p>`}
      <p>${nextLine()}</p>
      <div class="row"><button type="button" class="btn" id="copy">Copy summary as text</button>${S.me && S.me.canEdit ? `<button type="button" class="btn" id="done">${done ? "Reopen this decision" : "Mark this decision done"}</button>` : ""}<span id="copied" class="q"></span></div>
    </div>
    ${feedBox(activity(pid), 30)}`;
  box.querySelectorAll(".lc").forEach(b => b.addEventListener("click", () => { pendingItem = b.dataset.jump; show(b.dataset.tab); }));
  $("#copy").addEventListener("click", copySummary);
  const dn = $("#done"); if (dn) dn.addEventListener("click", () => setPageState(pid, done ? "open" : "done"));
  const ids = []; activity(pid).forEach(a => ids.push(a.by)); needProfiles(ids);
}
function laneCard(pg, pid, it) {
  const dec = decide(pid, it), st = statusOf(pid, it, dec), es = entriesFor(pid, it.id);
  const tone = toneOf(pg, it, dec.choice);
  return `<button type="button" class="lc" data-state="${tone}" data-jump="${esc(it.id)}" data-tab="${esc(it.tab)}">
    <span class="lr">${it.chip ? `<span class="chip">${esc(it.chip)}</span>` : ""}<span class="stamp${dec.how === "split" ? " split" : ""}" data-tone="${tone}">${esc(stampText(pg, it, dec))}</span>${st && !st.stale && st.state !== "reopened" ? `<span class="cst" data-state="${esc(st.state)}">${esc(CLAUDE_STATES[st.state] || st.state)}</span>` : ""}${roundOf(pid, it.id) > 1 ? `<span class="chip">Round ${roundOf(pid, it.id)}</span>` : ""}</span>
    <span class="lt">${esc(it.title)}</span>
    ${es.length ? `<span class="lr"><span class="avs">${es.map(e => avImg(e.by)).join("")}</span></span>` : ""}
    ${st && st.state === "needs" && st.note ? `<span class="nt">${esc(st.note)}</span>` : ""}
  </button>`;
}
function summaryText(pid) {
  const pg = S.pages[pid], items = pg.items || [];
  const lines = [`${pg.title || pid} — ${items.filter(i => isDecided(pid, i)).length} of ${items.length} decided`, ""];
  pageTabs(pg).forEach(t => {
    if (t.kind === "board" || t.kind === "plan" || t.kind === "library") return;
    lines.push("## " + (t.label || t.id));
    byTab(pg, t.id).forEach(i => {
      const dec = decide(pid, i), st = statusOf(pid, i, dec), es = entriesFor(pid, i.id);
      let s = `- ${i.chip ? i.chip + " " : ""}${i.title}: ${dec.how === "split" ? "SPLIT" : stampText(pg, i, dec)}`;
      if (es.length > 1 || (es[0] && !(S.me && es[0].by === S.me.id))) s += ` (${es.map(e => `${nameOf(e.by)}: ${e.choice ? labelOf(pg, i, e.choice) : "no verdict"}`).join(", ")})`;
      const notes = es.filter(e => e.note).map(e => `${nameOf(e.by)}: "${e.note}"`);
      if (notes.length) s += " — " + notes.join("; ");
      if (st && !st.stale) s += ` · Claude: ${st.state}${st.note ? " (" + st.note + ")" : ""}`;
      lines.push(s);
    });
    lines.push("");
  });
  return lines.join("\n");
}
async function copySummary() {
  const txt = summaryText(view.id), out = $("#copied");
  try { await navigator.clipboard.writeText(txt); out.textContent = "Copied."; }
  catch (e) {
    out.textContent = "Select the text below and copy it.";
    const ta = el("textarea", {readonly:""}); ta.value = txt;
    $(".final").append(ta); ta.select();
  }
}

/* ---------- tabs ---------- */
function show(id) {
  const pg = S.pages[view.id]; if (!pg) return;
  if (!tabOf(pg, id)) id = pageTabs(pg)[0].id;
  current = id;
  pageTabs(pg).forEach(t => {
    const tb = $("#tab-" + t.id);
    tb.setAttribute("aria-selected", String(t.id === id));
    tb.tabIndex = t.id === id ? 0 : -1;
    $("#panel-" + t.id).hidden = t.id !== id;
  });
  if (id === "board") renderBoard();
  if (id === "plan") renderPlan();
  try { history.replaceState(null, "", "#" + view.id + "." + id); } catch (e) {}
  const tb = $("#tab-" + id);
  if (tb.scrollIntoView) tb.scrollIntoView({inline:"nearest", block:"nearest"});
  if (pendingItem) jumpTo(pendingItem); else window.scrollTo(0, 0);
}

/* ---------- writes ---------- */
function vote(pid, list) {
  if (!S.me || !S.me.id) { setSave("Sign in to vote."); return; }
  if (S.me.canWrite === false) { setSave("View only: ask the owner for Contributor access to vote."); return; }
  const now = new Date().toISOString();
  const idx = S.votes.findIndex(v => v.page === pid && v.by === S.me.id);
  const base = idx >= 0 ? S.votes[idx] : {page:pid, by:S.me.id, items:{}};
  const items = Object.assign({}, base.items || {});
  for (const {iid, patch} of list) {
    const r = roundOf(pid, iid), prev = items[iid] || {}, same = (prev.round || 1) === r;
    const e = Object.assign({choice:null, note:""}, same ? prev : {}, patch, {round:r});
    if ("choice" in patch || "note" in patch) e.at = now;
    if ("due" in patch) e.dueAt = now;
    if (same && "choice" in patch && prev.choice && prev.choice !== patch.choice) e.was = (prev.was || []).concat([{choice:prev.choice, at:prev.at || null}]).slice(-10);
    if (!same && prev.at) e.hist = (prev.hist || []).concat([{round:prev.round || 1, choice:prev.choice || null, note:prev.note || "", at:prev.at}]);
    else if (prev.hist) e.hist = prev.hist;
    items[iid] = e;
  }
  const doc = {page:pid, by:S.me.id, owner:!!S.me.owner, items, at:now};
  S.votes = S.votes.slice(); if (idx >= 0) S.votes[idx] = doc; else S.votes.push(doc);
  for (const {iid} of list) { const it = itemOf(pid, iid); if (it) paint(pid, it); }
  paintCounts(); paintTodo();
  if (!S.db) return false;
  setSave("Saving…");
  const key = pid + "__" + S.me.id;
  Q[key] = (Q[key] || Promise.resolve())
    .then(() => S.db.doc("votes/" + key).set(doc))
    .then(() => {
      setSave("Saved " + clock());
      for (const k of [...failed]) if (k.startsWith(pid + ".")) { failed.delete(k); const it = itemOf(pid, k.slice(pid.length + 1)); if (it) paint(pid, it); }
      return true;
    })
    .catch(e => {
      setSave(e && e.code === "invalid_argument" ? "View only: your picks aren't being saved" : "Not saved. Click it again.", true);
      for (const {iid} of list) { failed.add(pid + "." + iid); const it = itemOf(pid, iid); if (it) paint(pid, it); }
      return false;
    });
  return Q[key];
}
/* Plan: the current step becomes done and the next unfinished step becomes current */
function finishNow(pid) {
  const before = S.pages[pid].plan, plan = JSON.parse(JSON.stringify(before)), all = (plan.phases || []).flatMap(p => p.steps || []);
  const i = all.findIndex(s => s.s === "now"); if (i < 0 || !S.db) return;
  Object.assign(all[i], {s:"done", doneAt:new Date().toISOString(), doneBy:(S.me && S.me.id) || "claude"});
  const n = all.slice(i + 1).find(s => s.s !== "done"); if (n) n.s = "now";
  setSave("Saving…");
  S.db.doc("pages/" + pid).update({plan})
    .then(() => {
      setSave("Saved " + clock());
      toast(`Marked “${all[i].t}” done`, "Undo", () => S.db.doc("pages/" + pid).update({plan:before}).then(() => setSave("Undone " + clock())).catch(() => setSave("Couldn't undo that.", true)));
    })
    .catch(() => setSave("Couldn't change that. Only an editor can.", true));
}
let toastTimer = null;
function toast(msg, act, fn) {
  const t = $("#toast"), b = t.querySelector("button");
  t.querySelector("span").textContent = msg; b.textContent = act;
  b.onclick = () => { t.hidden = true; clearTimeout(toastTimer); fn(); };
  t.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 8000);
}
function setPageState(pid, state) {
  if (!S.db) return;
  setSave("Saving…");
  S.db.doc("pages/" + pid).update({state, stateAt:new Date().toISOString(), stateBy:S.me && S.me.id || null})
    .then(() => setSave("Saved " + clock()))
    .catch(() => setSave("Couldn't change that. Only an editor can."));
}

/* ---------- live data ---------- */
function repaint() { if (view.kind === "page") paintAll(); else if (S.loaded) buildDash(); paintTodo(); }
async function init() {
  const can = window.claude && typeof window.claude.use === "function";
  if (!can) { S.loaded = true; setSave("Open this page from claude.ai to load decisions."); render(); return; }
  let user = null, db = null;
  try { [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]); } catch (e) {}
  S.user = user; S.db = db;
  if (user) {
    try {
      const me = await user.me(), cw = await user.can("data.write");
      S.me = {id:me.id, name:me.name || "", avatarUrl:me.avatarUrl || "", color:me.color || "", owner:!!me.isOwner, canEdit:!!me.canEdit, canWrite:cw};
      if (me.id) P[me.id] = {name:me.name || "", avatarUrl:me.avatarUrl || "", color:me.color || ""};
    } catch (e) {}
  }
  paintWho();
  if (!db) { S.loaded = true; setSave("Can't reach saved decisions here. Open the page from claude.ai while signed in."); render(); return; }
  const dead = () => setSave("Lost the connection to saved decisions. Reload the page.");
  db.collection("pages").onSnapshot(snap => {
    const p = {}; for (const d of snap.docs) p[d.id] = d.data();
    S.pages = p; S.loaded = true;
    setSave(!S.me || !S.me.id ? "Sign in to vote" : S.me.canWrite === false ? "View only" : "Saves on every click");
    render();
  }, dead);
  db.collection("votes").onSnapshot(snap => { S.votes = snap.docs.map(d => d.data()); repaint(); }, dead);
  db.collection("status").onSnapshot(snap => { const s = {}; for (const d of snap.docs) s[d.id] = d.data(); S.status = s; repaint(); }, dead);
}

/* ---------- go ---------- */
let startSkin = "soft";
try { const ls = localStorage.getItem("da-look"); if (ls) startSkin = ls; } catch (e) {}
setSkin(startSkin, false);
$("#skin").addEventListener("change", e => setSkin(e.target.value, true));
window.addEventListener("hashchange", render);
$("#zoom").addEventListener("click", () => $("#zoom").close());
render();
init();
</script>
